[project]
name = "interier-estimation"
version = "0.1.0"
description = "数量と単価から内装の見積りを組む"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
estimate = "estimate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["estimate"]
